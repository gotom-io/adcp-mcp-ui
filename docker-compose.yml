services:
    app:
        image: adcp-mcp-ui:latest
        container_name: adcp-mcp-ui
        build:
          context: .
          dockerfile: ./docker/Dockerfile
        working_dir: /app
        user: "${HOST_UID:?err}:${HOST_GID:?err}"
        entrypoint: ["node", "server.mjs"]
        volumes:
            - ./app:/app
        ports:
            - '3851:3000'
        networks:
            - adcpnetwork
        environment:
            OPENAI_API_KEY: ${OPENAI_API_KEY:-}
            ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
            VALID_ADCP_AUTH_KEYS: ${VALID_ADCP_AUTH_KEYS:-}
            MCP_SERVER_CHOICES: ${MCP_SERVER_CHOICES:-}
            # RFC 9421 request signing (optional; signing is off when unset)
            ADCP_BUYER_PRIVATE_JWK_FILE: ${ADCP_BUYER_PRIVATE_JWK_FILE:-}
            ADCP_BUYER_PRIVATE_JWK: ${ADCP_BUYER_PRIVATE_JWK:-}
            ADCP_BUYER_KID: ${ADCP_BUYER_KID:-}
            ADCP_BUYER_AGENT_URL: ${ADCP_BUYER_AGENT_URL:-}
            ADCP_BUYER_NAME: ${ADCP_BUYER_NAME:-}
            ADCP_BUYER_AGENT_ID: ${ADCP_BUYER_AGENT_ID:-}
            # Gate for signature-only sessions — see .env.example
            ADCP_SIGNING_PASSWORD: ${ADCP_SIGNING_PASSWORD:-}

networks:
    adcpnetwork:
        external: true
        name: adcpnetwork

